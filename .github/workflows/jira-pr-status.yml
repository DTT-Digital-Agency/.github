# Reusable: tells the Jira automation flow whether a PR is draft or ready for review.
name: Jira PR status

on:
  workflow_call:
    secrets:
      JIRA_PR_WEBHOOK_URL:
        required: true
      JIRA_PR_WEBHOOK_TOKEN:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 1 # keep Actions minutes usage minimal
    steps:
      - name: Send draft state to Jira
        env:
          URL: ${{ secrets.JIRA_PR_WEBHOOK_URL }}
          TOKEN: ${{ secrets.JIRA_PR_WEBHOOK_TOKEN }}
          TEXT: ${{ github.event.pull_request.head.ref }} ${{ github.event.pull_request.title }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          keys=$(grep -oiE '[a-z][a-z0-9]+-[0-9]+' <<< "$TEXT" | tr a-z A-Z | sort -u | jq -Rsc 'split("\n") | map(select(. != ""))')
          if [ "$keys" = "[]" ]; then echo "No Jira key in branch or title, skipping"; exit 0; fi
          echo "Issues: $keys, draft: $DRAFT"
          curl -sS --fail --max-time 15 -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Automation-Webhook-Token: $TOKEN" \
            -d "{\"issues\":$keys,\"data\":{\"draft\":$DRAFT}}"
