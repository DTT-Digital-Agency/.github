# Reusable: sends every GitHub -> Jira status event to one Jira webhook flow.
# Jira keys only ever come from branch names, PR titles or commit subjects - never PR descriptions.
#   create (branch)                      -> branch_created     (key from branch name)
#   PR opened/reopened/ready/draft       -> pr_state + draft   (keys from branch + title)
#   PR merged into a *master* branch     -> merged_to_master   (keys from branch + title)
#   PR master -> staging merged          -> merged_to_staging  (keys from first line of each commit)
name: Jira PR status

on:
  workflow_call:
    inputs:
      main_branch:
        type: string
        default: master
      staging_branch:
        type: string
        default: staging
    secrets:
      JIRA_PR_WEBHOOK_URL:
        required: true
      JIRA_PR_WEBHOOK_TOKEN:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 1 # keep Actions minutes usage minimal
    steps:
      - name: Send status event to Jira
        env:
          URL: ${{ secrets.JIRA_PR_WEBHOOK_URL }}
          TOKEN: ${{ secrets.JIRA_PR_WEBHOOK_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CREATED_REF: ${{ github.event.ref }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          DRAFT: ${{ github.event.pull_request.draft }}
          MAIN: ${{ inputs.main_branch }}
          STAGING: ${{ inputs.staging_branch }}
        run: |
          if [ "$EVENT" = "create" ]; then
            TEXT="$CREATED_REF"; DATA='{"event":"branch_created"}'
          elif [ "$ACTION" = "closed" ] && [ "$HEAD" = "$MAIN" ] && [ "$BASE" = "$STAGING" ]; then
            TEXT=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '.[].commit.message | split("\n")[0]')
            DATA='{"event":"merged_to_staging"}'
          elif [ "$ACTION" = "closed" ]; then
            TEXT="$HEAD $TITLE"; DATA='{"event":"merged_to_master"}'
          else
            TEXT="$HEAD $TITLE"; DATA="{\"event\":\"pr_state\",\"draft\":$DRAFT}"
          fi
          keys=$(grep -oiE '[a-z][a-z0-9]+-[0-9]+' <<< "$TEXT" | tr a-z A-Z | sort -u | jq -Rsc 'split("\n") | map(select(. != ""))')
          if [ "$keys" = "[]" ]; then echo "No Jira key found, skipping"; exit 0; fi
          echo "Issues: $keys, data: $DATA"
          curl -sS --fail --max-time 15 -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Automation-Webhook-Token: $TOKEN" \
            -d "{\"issues\":$keys,\"data\":$DATA}"
